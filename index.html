        Applying for government services does not need to involve multiple trips

      </p>

      <h2 id="howStep1Title" data-i18n="howStep1Title">1. Search your service</h2>

      <h2 id="howStep2Title" data-i18n="howStep2Title">2. Check basic eligibility</h2>

    <div id="view-about" class="static-page">

      <h1>About SevaCheck Kerala</h1>

      <p>
        <strong>SevaCheck Kerala</strong> is an independent information and guidance
        platform created to reduce confusion regarding public administrative procedures in Kerala.
      </p>

      <h2>Our Core Rules</h2>

      <ul>
        <li>
          <strong>No Personal Identifiers Collected:</strong>
          We do not ask for, process, or store your identification numbers,
          passwords, or personal credentials.
        </li>

        <li>
          <strong>No Government Affiliation:</strong>
          We are not a government agency, not an Akshaya centre,
          and not affiliated with the Government of Kerala.
        </li>

        <li>
          <strong>Official Link Policy:</strong>
          Whenever possible, SevaCheck links to official government portals
          or authorised official service-provider portals.
        </li>

        <li>
          <strong>No Guaranteed Claims:</strong>
          We never promise fast approvals or document issuance,
          as only authorized government officers hold that statutory power.
        </li>
      </ul>

      <h2>Feedback &amp; Updates</h2>

      <p>
        Rules and required proofs change periodically through official gazette notifications.
        If you notice outdated information, verify with the official department website
        or authorised service centre before applying.
      </p>

      <p>
        If you notice outdated information or want to share feedback,
        you can contact us at
        <a href="mailto:support@sevacheck.org">support@sevacheck.org</a>.
      </p>
